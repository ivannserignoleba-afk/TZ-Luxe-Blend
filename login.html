<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TZ LUXE | Connexion propriétaire</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1a1413, #4c362d 60%, #d6b27a);
      color: #fff;
    }
    .login-box {
      width: min(420px, calc(100% - 26px));
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 28px 60px rgba(17, 14, 13, 0.22);
      backdrop-filter: blur(10px);
    }
    .brand {
      font-family: Georgia, serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.78);
      margin-bottom: 22px;
      font-size: 0.94rem;
    }
    form {
      display: grid;
      gap: 14px;
    }
    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      padding: 12px 14px;
      font: inherit;
    }
    input::placeholder { color: rgba(255,255,255,0.7); }
    button {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #d3a86d, #9d7742);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: #ffd5d5;
      font-size: 0.92rem;
    }
    .error.show { display: block; }
    .hint {
      color: rgba(255,255,255,0.68);
      font-size: 0.8rem;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">TZ LUXE</div>
    <div class="subtitle">Accès réservé au propriétaire</div>

    <form id="loginForm">
      <input type="text" id="username" name="username" placeholder="Nom d’utilisateur" autocomplete="username" required />
      <input type="password" id="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required />
      <button type="submit">Se connecter</button>
    </form>

    <div class="error" id="errorMessage">Identifiants incorrects.</div>
    <div class="hint">Par défaut : admin / TZLUXE2026</div>
  </div>

  <script>
    const OWNER_USERNAME = 'admin';
    const OWNER_PASSWORD = 'TZLUXE2026';
    const SESSION_KEY = 'tzluxe_owner_session';

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    if (localStorage.getItem(SESSION_KEY) === 'true') {
      window.location.href = 'admin.html';
    }

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === OWNER_USERNAME && password === OWNER_PASSWORD) {
        localStorage.setItem(SESSION_KEY, 'true');
        window.location.href = 'admin.html';
      } else {
        errorMessage.classList.add('show');
      }
    });

  </script>
</body>
</html>
